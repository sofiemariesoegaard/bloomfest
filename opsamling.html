<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Din blomst | Bloomfest</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="./style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kavoon&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png">
  <link rel="manifest" href="./favicon_io/site.webmanifest">
</head>

<body class="fade-in">
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">Bloomfest</a>
      <nav class="site-nav">
        <button popovertarget="menu">Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="opsamling-page">

      <div class="opsamling-intro">
        <h1>Din blomst er fundet!</h1>
        <p id="bruger-navn"></p>

        <div class="actions">
          <a class="button" href="./form.html">Prøv igen</a>
        </div>
      </div>

      <article class="blomster-frimaerke">
        <p class="resultat-intro"> Dit blomsterresultat</p>

        <img class="resultat-billede" src="" alt="">

        <h2 class="resultat-navn"></h2>

        <p class="resultat-beskrivelse"></p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <h4 class="grid_logo">BloomFest</h4>
      <div class="grid_footer_1">
        <p class="bold">Om BloomFest</p>
        <p>Læs mere om BloomFest her</p>
      </div>
      <div class="grid_footer_2">
        <p class="bold">Kontakt os</p>
        <p>+45 60 70 85 46</p>
        <p>bloomfest@kontakt.dk</p>
      </div>
      <div class="grid_footer_3">
        <p class="bold">Sociale medier</p>
        <div class="grid_imgs">
          <div class="grid_3-1">
            <img class="footer_imgs" src="./imgs/tiktok.png" alt="TikTok">
          </div>
          <div class="grid_3-2">
            <img class="footer_imgs" src="./imgs/instagram.png" alt="Instagram">
          </div>
          <div class="grid_3-3">
            <img class="footer_imgs" src="./imgs/facebook.png" alt="Facebook">
          </div>
        </div>
      </div>
    </div>
